# Simple Voice Chat: голос слышен только рядом, как рация "в поле".
# Порт UDP должен быть открыт на сервере (по умолчанию 24454).
port=24454
bind_address=
max_voice_distance=40.0
crouch_distance_multiplier=0.5
whisper_distance_multiplier=0.4
codec=VOIP
mtu_size=1024
keep_alive=1000
enable_groups=true
voice_host=
allow_recording=false
spectator_interaction=false
spectator_player_possession=false
force_voice_chat=false
login_timeout=10000
broadcast_range=-1.0
allow_pings=true
