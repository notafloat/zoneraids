# Moves Like Mafuyu, tuned for an extraction shooter. Only what differs from the defaults is listed,
# Forge fills in the rest on first start.

[slide]
	# Sliding comes from TACtical Movement (its "Prone And Slide" key while sprinting); one slide is enough.
	enableSlide = false
	enableDap = false
	enableSlideKnock = false
	# No invulnerability frames in PvP: a roll must not dodge bullets.
	enableRollInvulnerability = false
	enableAirRoll = false
	# The roll camera spin makes aiming after a roll hard.
	enableRollCamera = false
	# The roll is on Zone Raids' own key (C), also from standstill. The sprint trigger is cut off: double tap
	# only, within a 0 ms window (RollDoublePressDelay below), which never happens.
	enableSprintRollDoubleTapTrigger = true

[crawling]
	# Prone comes from TACtical Movement / TaCZ, Mafuyu's crawl detects poses differently and conflicts.
	enableCraw = false
	enableCrawSlide = false
	enableLeap = false

[auto_dodge]
	enableAutoDodge = false

[shortcut]
	# Extra Shift/Ctrl bindings would clash with sneak and sprint; the roll has its own key in Zone Raids.
	enableShortcut = false

[roll_attributes]
	# One roll every 3 seconds: a dash into cover, not a way to move. Zone Raids' roll key keeps the same
	# cooldown itself, Mafuyu's entry point it calls does not check this one.
	RollCooldown = 60
	RollDoublePressDelay = 0
